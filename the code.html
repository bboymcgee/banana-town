document.write("<!DOCTYPE html>\r\n<html lang=\"en\">\r\n<head>\r\n    <meta charset=\"UTF-8\">\r\n    <style>\r\nbody { \r\n    font-family: 'Courier New', Courier, monospace; \r\n    display: flex; \r\n    justify-content: center; \r\n    align-items: center; \r\n    height: 100vh;  \r\n    margin: 0; \r\n}\r\n\r\n#login-box { \r\n    background: var(--bg); \r\n    padding: 2rem; \r\n    border: 2px solid var(--accent2);\r\n    border-radius: 4px; \r\n    box-shadow: 0 0 15px var(--accent1); \r\n    text-align: left; \r\n    color: var(--accent1);\r\n    max-width: 400px;\r\n    width: 100%;\r\n}\r\n\r\n\/* Optional header style for the login box if you want to add a title *\/\r\n#login-box::before {\r\n    content: \"SYSTEM ACCESS REQUIRED \/\/\";\r\n    display: block;\r\n    font-weight: bold;\r\n    margin-bottom: 1.5rem;\r\n    font-size: 1.1rem;\r\n    letter-spacing: 1px;\r\n}\r\n\r\ninput { \r\n    background: var(--bg);\r\n    border: 1px solid var(--accent1);\r\n    color: var(--text);\r\n    border-radius:5px;\r\n    padding: 0.6rem; \r\n    font-size: 1rem; \r\n    margin-bottom: 1rem;\r\n    font-family: inherit;\r\n    width: 100%;\r\n    box-sizing: border-box;\r\n}\r\n\r\ninput:focus {\r\n    outline: none;\r\n    box-shadow: 0 0 8px var(--accent1);\r\n}\r\n<\/style>\r\n<\/head>\r\n<body>\r\n\r\n    <head>\r\n        <meta charset=\"UTF-8\" \/>\r\n        <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" \/>\r\n        <title>Banana Town<\/title>\r\n        <link\r\n            rel=\"icon\"\r\n            type=\"image\/x-icon\"\r\n            href=\"https:\/\/github.com\/CorduroyBrick49\/Banana Town\/blob\/main\/AtlasIcon.ico?raw=true\"\r\n        \/>\r\n        <link\r\n            href=\"https:\/\/fonts.googleapis.com\/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap\"\r\n            rel=\"stylesheet\"\r\n        \/>\r\n        <style>\r\n            *,\r\n            *::before,\r\n            *::after {\r\n                margin: 0;\r\n                padding: 0;\r\n                box-sizing: border-box;\r\n            }\r\n\r\n            :root {\r\n                --bg: #0b0b12;\r\n                --card: rgba(20, 20, 35, 0.7);\r\n                --border: rgba(168, 85, 247, 0.25);\r\n                --text: #ffffff;\r\n                --muted: #cbd5e1;\r\n                --accent1: #a855f7;\r\n                --accent2: #6366f1;\r\n                --bg-image: none;\r\n                --cardText: #d3d3d3;\r\n                --radius-sm: 8px;\r\n                --radius-md: 10px;\r\n                --radius-lg: 14px;\r\n                --radius-xl: 18px;\r\n                --transition-fast: 0.15s ease;\r\n                --transition-med: 0.25s ease;\r\n                --transition-slow: 0.35s ease;\r\n            }\r\n\r\n            html {\r\n                font-size: 16px;\r\n            }\r\n\r\n            body {\r\n                font-family:\r\n                    \"Manrope\",\r\n                    -apple-system,\r\n                    BlinkMacSystemFont,\r\n                    \"Segoe UI\",\r\n                    sans-serif;\r\n                min-height: 100vh;\r\n                display: flex;\r\n                background: var(--bg);\r\n                color: var(--text);\r\n                -webkit-font-smoothing: antialiased;\r\n                -moz-osx-font-smoothing: grayscale;\r\n                transition:\r\n                    background var(--transition-slow),\r\n                    color var(--transition-slow);\r\n            }\r\n\r\n            body::before {\r\n                content: \"\";\r\n                position: fixed;\r\n                inset: 0;\r\n                z-index: -1;\r\n                background-image: var(--bg-image);\r\n                background-size: cover;\r\n                background-position: center;\r\n                background-repeat: no-repeat;\r\n                opacity: 0.35;\r\n                pointer-events: none;\r\n                transition:\r\n                    background-image var(--transition-slow),\r\n                    opacity var(--transition-slow);\r\n            }\r\n\r\n            \/* \u2500\u2500 SIDEBAR \u2500\u2500 *\/\r\n            .sidebar {\r\n                position: fixed;\r\n                top: 0;\r\n                left: 0;\r\n                width: 260px;\r\n                height: 100vh;\r\n                z-index: 10;\r\n                padding: 22px 16px;\r\n                display: flex;\r\n                flex-direction: column;\r\n                gap: 14px;\r\n                background: var(--card);\r\n                backdrop-filter: blur(16px);\r\n                -webkit-backdrop-filter: blur(16px);\r\n                border-right: 1px solid var(--border);\r\n                overflow-y: auto;\r\n                overflow-x: hidden;\r\n                transition:\r\n                    background var(--transition-slow),\r\n                    border-color var(--transition-slow);\r\n            }\r\n\r\n            .sidebar::-webkit-scrollbar {\r\n                width: 4px;\r\n            }\r\n            .sidebar::-webkit-scrollbar-thumb {\r\n                background: var(--border);\r\n                border-radius: 4px;\r\n            }\r\n\r\n            .logo {\r\n                font-size: 1.6rem;\r\n                font-weight: 800;\r\n                letter-spacing: -0.02em;\r\n                background: linear-gradient(135deg, var(--accent1), var(--accent2));\r\n                -webkit-background-clip: text;\r\n                -webkit-text-fill-color: transparent;\r\n                background-clip: text;\r\n                display: flex;\r\n                align-items: center;\r\n                gap: 8px;\r\n                padding: 2px 0 6px;\r\n                user-select: none;\r\n            }\r\n\r\n            .logo svg {\r\n                flex-shrink: 0;\r\n                \/* SVG stroke inherits from color but we need to override text-fill *\/\r\n                stroke: var(--accent1);\r\n            }\r\n\r\n            .sidebar-label {\r\n                font-size: 0.7rem;\r\n                font-weight: 600;\r\n                letter-spacing: 0.08em;\r\n                text-transform: uppercase;\r\n                color: var(--muted);\r\n                opacity: 0.6;\r\n                padding: 0 4px;\r\n            }\r\n\r\n            .sidebar hr {\r\n                border: none;\r\n                border-top: 1px solid var(--border);\r\n                margin: 2px 0;\r\n            }\r\n\r\n            \/* \u2500\u2500 SEARCH \u2500\u2500 *\/\r\n            .search {\r\n                width: 100%;\r\n                padding: 10px 14px;\r\n                border-radius: var(--radius-md);\r\n                border: 1px solid var(--border);\r\n                background: rgba(0, 0, 0, 0.2);\r\n                color: var(--text);\r\n                font-family: inherit;\r\n                font-size: 0.875rem;\r\n                font-weight: 400;\r\n                outline: none;\r\n                transition:\r\n                    border-color var(--transition-fast),\r\n                    background var(--transition-fast);\r\n            }\r\n\r\n            .search::placeholder {\r\n                color: var(--muted);\r\n                opacity: 0.6;\r\n            }\r\n\r\n            .search:focus {\r\n                border-color: var(--accent1);\r\n                background: rgba(0, 0, 0, 0.3);\r\n            }\r\n\r\n            \/* \u2500\u2500 GENRE PILLS \u2500\u2500 *\/\r\n            .genres {\r\n                display: flex;\r\n                flex-wrap: wrap;\r\n                gap: 5px;\r\n            }\r\n\r\n            .genre-btn {\r\n                padding: 5px 10px;\r\n                border-radius: 999px;\r\n                border: 1px solid var(--border);\r\n                font-family: inherit;\r\n                font-size: 0.72rem;\r\n             .fav-item::before {\r\n                content: \"\";\r\n                position: absolute;\r\n                inset: 0;\r\n                background: rgba(0, 0, 0, 0.45);\r\n                z-index: 0;\r\n            }\r\n\r\n            .fav-item span {\r\n                position: relative;\r\n                z-index: 1;\r\n            }\r\n\r\n            .fav-item:hover {\r\n                transform: translateY(-2px);\r\n                border-color: var(--accent1);\r\n                filter: brightness(1.15);\r\n            }\r\n\r\n            .fav-empty {\r\n                font-size: 0.78rem;\r\n                color: var(--muted);\r\n                opacity: 0.5;\r\n                padding: 4px;\r\n            }\r\n\r\n            \/* \u2500\u2500 THEME BUTTONS \u2500\u2500 *\/\r\n            .theme-btn {\r\n                display: flex;\r\n                align-items: center;\r\n                gap: 8px;\r\n                padding: 9px 12px;\r\n                border-radius: var(--radius-md);\r\n                border: 1px solid var(--border);\r\n                background: rgba(0, 0, 0, 0.15);\r\n                color: var(--muted);\r\n                font-family: inherit;\r\n                font-size: 0.82rem;\r\n                font-weight: 500;\r\n                cursor: pointer;\r\n                transition:\r\n                    transform var(--transition-fast),\r\n                    border-color var(--transition-fast),\r\n                    background var(--transition-fast),\r\n                    color var(--transition-fast);\r\n            }\r\n\r\n            .theme-btn:hover {\r\n                transform: translateY(-1px);\r\n                border-color: var(--accent1);\r\n                color: var(--text);\r\n            }\r\n\r\n            .theme-btn.active {\r\n                background: linear-gradient(135deg, var(--accent1), var(--accent2));\r\n                color: #fff;\r\n                border-color: transparent;\r\n            }\r\n\r\n            .theme-swatch {\r\n                width: 10px;\r\n                height: 10px;\r\n                border-radius: 50%;\r\n                flex-shrink: 0;\r\n            }\r\n\r\n            \/* \u2500\u2500 MAIN \u2500\u2500 *\/\r\n            .main {\r\n                flex: 1;\r\n                margin-left: 260px;\r\n                padding: 32px 32px 48px;\r\n            }\r\n\r\n            .header {\r\n                margin-bottom: 4px;\r\n            }\r\n\r\n            .header h1 {\r\n                font-size: 2.6rem;\r\n                font-weight: 800;\r\n                letter-spacing: -0.03em;\r\n                line-height: 1;\r\n            }\r\n\r\n            .header p {\r\n                margin-top: 6px;\r\n                font-size: 0.9rem;\r\n                color: var(--muted);\r\n                font-weight: 400;\r\n            }\r\n\r\n            \/* \u2500\u2500 GAME GRID \u2500\u2500 *\/\r\n            .container {\r\n                margin-top: 24px;\r\n                display: grid;\r\n                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));\r\n                gap: 16px;\r\n            }\r\n\r\n            .box {\r\n                position: relative;\r\n                overflow: hidden;\r\n                display: flex;\r\n                flex-direction: column;\r\n                min-height: 210px;\r\n                padding: 16px;\r\n                border-radius: var(--radius-xl);\r\n                border: 1px solid var(--border);\r\n                background: var(--card);\r\n                backdrop-filter: blur(10px);\r\n                -webkit-backdrop-filter: blur(10px);\r\n                animation: cardPopIn 0.35s ease both;\r\n                transition:\r\n                    transform var(--transition-med),\r\n                    box-shadow var(--transition-med),\r\n                    border-color var(--transition-med),\r\n                    filter var(--transition-med);\r\n                cursor: default;\r\n            }\r\n\r\n            .box:hover {\r\n                transform: translateY(-6px) scale(1.005);\r\n                filter: brightness(1.1);\r\n                border-color: var(--accent1);\r\n                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);\r\n            }\r\n\r\n            .box * {\r\n                position: relative;\r\n                z-index: 1;\r\n            }\r\n\r\n            .box h3 {\r\n                font-size: 1.05rem;\r\n                font-weight: 700;\r\n                margin-bottom: 5px;\r\n                color: var(--cardText);\r\n                line-height: 1.2;\r\n            }\r\n\r\n            .box p {\r\n                font-size: 0.82rem;\r\n                line-height: 1.5;\r\n                color: var(--cardText);\r\n                opacity: 0.85;\r\n                flex: 1;\r\n                margin-bottom: 12px;\r\n            }\r\n\r\n            .card-top {\r\n                display: flex;\r\n                flex-direction: column;\r\n                gap: 8px;\r\n                margin-bottom: 8px;\r\n                flex: 1;\r\n            }\r\n\r\n            .card-topbar {\r\n                display: flex;\r\n                justify-content: space-between;\r\n                align-items: flex-start;\r\n                gap: 8px;\r\n            }\r\n\r\n            .genre-tags {\r\n                display: flex;\r\n                flex-wrap: wrap;\r\n                gap: 5px;\r\n            }\r\n\r\n            .genre-tag {\r\n                font-size: 0.67rem;\r\n                font-weight: 600;\r\n                padding: 3px 8px;\r\n                border-radius: 999px;\r\n                border: 1px solid var(--border);\r\n                color: var(--muted);\r\n                background: rgba(0, 0, 0, 0.2);\r\n                line-height: 1;\r\n            }\r\n\r\n            \/* \u2500\u2500 FAVORITE BUTTON \u2500\u2500 *\/\r\n            .favorite-btn {\r\n                width: 24px;\r\n                height: 24px;\r\n                flex-shrink: 0;\r\n                display: flex;\r\n                align-items: center;\r\n                justify-content: center;\r\n                padding: 0;\r\n                line-height: 1;\r\n                font-size: 13px;\r\n                border-radius: var(--radius-sm);\r\n                cursor: pointer;\r\n                background: rgba(0, 0, 0, 0.3);\r\n                border: 1px solid rgba(255, 255, 255, 0.12);\r\n                color: rgba(255, 255, 255, 0.5);\r\n                transition:\r\n                    transform var(--transition-fast),\r\n                    border-color var(--transition-fast),\r\n                    background var(--transition-fast),\r\n                    color var(--transition-fast),\r\n                    box-shadow var(--transition-fast);\r\n            }\r\n\r\n            .favorite-btn:hover {\r\n                transform: scale(1.1);\r\n                border-color: rgba(255, 213, 74, 0.5);\r\n                color: rgba(255, 213, 74, 0.8);\r\n            }\r\n\r\n            .favorite-btn.active {\r\n                color: #ffd54a;\r\n                border-color: rgba(255, 213, 74, 0.5);\r\n                background: rgba(255, 213, 74, 0.12);\r\n                box-shadow: 0 0 8px rgba(255, 213, 74, 0.3);\r\n                animation: favPop 0.25s ease;\r\n            }\r\n\r\n            .favorite-btn:active {\r\n                transform: scale(0.88);\r\n            }\r\n\r\n            \/* \u2500\u2500 LAUNCH BUTTON \u2500\u2500 *\/\r\n            .launch-btn {\r\n                width: 100%;\r\n                padding: 9px 14px;\r\n                border-radius: var(--radius-md);\r\n                border: none;\r\n                font-family: inherit;\r\n                font-size: 0.82rem;\r\n                font-weight: 700;\r\n                cursor: pointer;\r\n                background: linear-gradient(135deg, var(--accent1), var(--accent2));\r\n                color: #fff;\r\n                letter-spacing: 0.01em;\r\n                transition:\r\n                    filter var(--transition-fast),\r\n                    transform var(--transition-fast);\r\n                margin-top: auto;\r\n            }\r\n\r\n            .launch-btn:hover {\r\n                filter: brightness(1.15);\r\n                transform: translateY(-2px);\r\n            }\r\n\r\n            .launch-btn:active {\r\n                transform: translateY(1px);\r\n                filter: brightness(0.95);\r\n            }\r\n\r\n            \/* \u2500\u2500 TOP-RIGHT ICON BUTTONS \u2500\u2500 *\/\r\n            .icon-btn {\r\n                position: fixed;\r\n                top: 14px;\r\n                z-index: 1000;\r\n                width: 34px;\r\n                height: 34px;\r\n                border-radius: var(--radius-md);\r\n                border: 1px solid var(--border);\r\n                background: var(--card);\r\n                color: var(--muted);\r\n                cursor: pointer;\r\n                padding: 0;\r\n                display: flex;\r\n                align-items: center;\r\n                justify-content: center;\r\n                backdrop-filter: blur(14px);\r\n                -webkit-backdrop-filter: blur(14px);\r\n                transition:\r\n                    border-color var(--transition-fast),\r\n                    color var(--transition-fast),\r\n                    background var(--transition-fast),\r\n                    transform var(--transition-fast);\r\n            }\r\n\r\n            .icon-btn svg {\r\n                display: block;\r\n                flex-shrink: 0;\r\n            }\r\n\r\n            .icon-btn:hover {\r\n                border-color: var(--accent1);\r\n                color: var(--text);\r\n                transform: scale(1.06);\r\n            }\r\n\r\n            .icon-btn.active {\r\n                border-color: var(--accent1);\r\n                color: var(--accent1);\r\n                background: rgba(168, 85, 247, 0.1);\r\n            }\r\n\r\n            #cloak-btn {\r\n                right: 14px;\r\n            }\r\n            #settings-btn {\r\n                right: 56px;\r\n            }\r\n\r\n            \/* \u2500\u2500 PANELS \u2500\u2500 *\/\r\n            .panel {\r\n                position: fixed;\r\n                right: 14px;\r\n                z-index: 1000;\r\n                width: 295px;\r\n                background: var(--card);\r\n                border: 1px solid var(--border);\r\n                border-radius: var(--radius-xl);\r\n                backdrop-filter: blur(22px);\r\n                -webkit-backdrop-filter: blur(22px);\r\n                padding: 16px;\r\n                display: flex;\r\n                flex-direction: column;\r\n                gap: 12px;\r\n                opacity: 0;\r\n                pointer-events: none;\r\n                transform: translateY(-6px) scale(0.98);\r\n                transition:\r\n                    opacity 0.2s ease,\r\n                    transform 0.2s ease;\r\n            }\r\n\r\n            .panel.open {\r\n                opacity: 1;\r\n                pointer-events: all;\r\n                transform: translateY(0) scale(1);\r\n            }\r\n\r\n            #cloak-panel {\r\n                top: 56px;\r\n            }\r\n            #settings-panel {\r\n                top: 56px;\r\n            }\r\n\r\n            .panel-header h4 {\r\n                font-size: 0.9rem;\r\n                font-weight: 700;\r\n                color: var(--text);\r\n                margin-bottom: 2px;\r\n            }\r\n\r\n            .panel-header p {\r\n                font-size: 0.72rem;\r\n                color: var(--muted);\r\n                opacity: 0.7;\r\n            }\r\n\r\n            \/* \u2500\u2500 CLOAK PRESETS \u2500\u2500 *\/\r\n            .cloak-presets {\r\n   search: document.getElementById(\"search\"),\r\n                genreBar: document.getElementById(\"genreBar\"),\r\n                favoritesBar: document.getElementById(\"favoritesBar\"),\r\n                themeBtns: document.querySelectorAll(\".theme-btn\"),\r\n                loader: document.getElementById(\"loading-screen\"),\r\n                cloakBtn: document.getElementById(\"cloak-btn\"),\r\n                cloakPanel: document.getElementById(\"cloak-panel\"),\r\n                settingsBtn: document.getElementById(\"settings-btn\"),\r\n                settingsPanel: document.getElementById(\"settings-panel\"),\r\n            };\r\n\r\n            \/* \u2500\u2500 STATE \u2500\u2500 *\/\r\n            const STATE = {\r\n                activeGenre: \"All\",\r\n                favorites: JSON.parse(localStorage.getItem(\"atlas_favorites\") || \"[]\"),\r\n                MAX_FAVORITES: 5,\r\n            };\r\n\r\n            \/* \u2500\u2500 THEMES \u2500\u2500 *\/\r\n            const THEMES = {\r\n                dark: {\r\n                    bg: \"linear-gradient(135deg,#05060a,#0b0f1a,#120a1f)\",\r\n                    card: \"rgba(15,15,25,0.8)\",\r\n                    border: \"rgba(120,90,255,0.25)\",\r\n                    text: \"#ffffff\",\r\n                    muted: \"#a9b0c3\",\r\n                    accent1: \"#7c3aed\",\r\n                    accent2: \"#2563eb\",\r\n                    cardText: \"#d3d3d3\",\r\n                    bgImage: null,\r\n                },\r\n                tokyoNight: {\r\n                    bg: \"linear-gradient(135deg,#0B0F1A 0%,#141026 50%,#1A1230 100%)\",\r\n                    card: \"rgba(25,20,45,0.72)\",\r\n                    border: \"rgba(255,105,180,0.25)\",\r\n                    text: \"#EDE7F6\",\r\n                    muted: \"#A79BC7\",\r\n                    accent1: \"#FF4FD8\",\r\n                    accent2: \"#A79BC7\",\r\n                    cardText: \"#F5F0FF\",\r\n                    bgImage: \"https:\/\/github.com\/CorduroyBrick49\/Themes\/blob\/main\/TokyoCity.gif?raw=true\",\r\n                },\r\n                rootbeer: {\r\n                    bg: \"linear-gradient(135deg,#1A0F05 0%,#2E1A0A 45%,#3D2410 100%)\",\r\n                    card: \"rgba(45,25,8,0.78)\",\r\n                    border: \"rgba(180,110,40,0.22)\",\r\n                    text: \"#F5E6D0\",\r\n                    muted: \"#B8946A\",\r\n                    accent1: \"#A0522D\",\r\n                    accent2: \"#D4956A\",\r\n                    cardText: \"#FFF3E0\",\r\n                    bgImage: \"https:\/\/github.com\/CorduroyBrick49\/Themes\/blob\/main\/rootbeer.png?raw=true\",\r\n                },\r\n            };\r\n\r\n            \/* \u2500\u2500 THEME \u2500\u2500 *\/\r\n            const Theme = {\r\n                apply(name) {\r\n                    const t = THEMES[name];\r\n                    if (!t) return;\r\n                    const r = document.documentElement;\r\n                    const map = {\r\n                        \"--bg\": t.bg,\r\n                        \"--card\": t.card,\r\n                        \"--border\": t.border,\r\n                        \"--text\": t.text,\r\n                        \"--muted\": t.muted,\r\n                        \"--accent1\": t.accent1,\r\n                        \"--accent2\": t.accent2,\r\n                        \"--cardText\": t.cardText,\r\n                        \"--bg-image\": t.bgImage ? `url(${t.bgImage})` : \"none\",\r\n                    };\r\n                    Object.entries(map).forEach(([k, v]) => r.style.setProperty(k, v));\r\n                    localStorage.setItem(\"atlas_theme\", name);\r\n                    DOM.themeBtns.forEach((b) => b.classList.toggle(\"active\", b.dataset.theme === name));\r\n                },\r\n                getPreferred() {\r\n                    const saved = localStorage.getItem(\"atlas_theme\");\r\n                    if (saved && THEMES[saved]) return saved;\r\n                    return window.matchMedia(\"(prefers-color-scheme: dark)\").matches ? \"dark\" : \"light\";\r\n                },\r\n                init() {\r\n                    DOM.themeBtns.forEach((btn) => {\r\n                        btn.onclick = (e) => {\r\n                            e.stopPropagation();\r\n                            Theme.apply(btn.dataset.theme);\r\n                        };\r\n                    });\r\n                },\r\n            };\r\n\r\n            \/* \u2500\u2500 TOAST \u2500\u2500 *\/\r\n            const Toast = {\r\n                el: null,\r\n                timer: null,\r\n                show(msg) {\r\n                    if (!this.el) {\r\n                        this.el = document.createElement(\"div\");\r\n                        this.el.className = \"toast\";\r\n                        document.body.appendChild(this.el);\r\n                    }\r\n                    this.el.textContent = msg;\r\n                    clearTimeout(this.timer);\r\n                    requestAnimationFrame(() => {\r\n                        this.el.classList.add(\"show\");\r\n                        this.timer = setTimeout(() => this.el.classList.remove(\"show\"), 2000);\r\n                    });\r\n                },\r\n            };\r\n\r\n            \/* \u2500\u2500 FAVORITES \u2500\u2500 *\/\r\n            const Favorites = {\r\n                save() {\r\n                    localStorage.setItem(\"atlas_favorites\", JSON.stringify(STATE.favorites));\r\n                    this.render();\r\n                },\r\n                toggle(item) {\r\n                    const idx = STATE.favorites.findIndex((f) => f.name === item.name);\r\n                    if (idx === -1) {\r\n                        if (STATE.favorites.length >= STATE.MAX_FAVORITES) {\r\n                            Toast.show(\"Max 5 favorites reached\");\r\n                            return;\r\n                        }\r\n                        STATE.favorites.push(item);\r\n                        Toast.show(`\u2605 Added \"${item.name}\"`);\r\n                    } else {\r\n                        STATE.favorites.splice(idx, 1);\r\n                        Toast.show(`Removed \"${item.name}\"`);\r\n                    }\r\n                    this.save();\r\n                    this.updateStars();\r\n                },\r\n                render() {\r\n                    DOM.favoritesBar.innerHTML = \"\";\r\n                    if (!STATE.favorites.length) {\r\n                        DOM.favoritesBar.innerHTML = `<div class=\"fav-empty\">No favorites yet<\/div>`;\r\n                        return;\r\n                    }\r\n                    STATE.favorites.forEach((item) => {\r\n                        const btn = document.createElement(\"button\");\r\n                        btn.className = \"fav-item\";\r\n                        btn.style.backgroundImage = `url(${item.image})`;\r\n                        btn.innerHTML = `<span>${item.name}<\/span>`;\r\n                        btn.onclick = () => Game.open(item.url);\r\n                        DOM.favoritesBar.appendChild(btn);\r\n                    });\r\n                },\r\n                updateStars() {\r\n                    document.querySelectorAll(\".box\").forEach((box) => {\r\n                        const name = box.querySelector(\"h3\").textContent;\r\n                        box.querySelector(\".favorite-btn\").classList.toggle(\r\n                            \"active\",\r\n                            STATE.favorites.some((f) => f.name === name)\r\n                        );\r\n                    });\r\n                },\r\n            };\r\n\r\n            \/* \u2500\u2500 GAME LAUNCHER \u2500\u2500 *\/\r\n            const Game = {\r\n                open(url) {\r\n                    DOM.loader.classList.add(\"active\");\r\n                    setTimeout(() => {\r\n                        fetch(url)\r\n                            .then((r) => r.text())\r\n                            .then((html) => {\r\n                                const base = url.slice(0, url.lastIndexOf(\"\/\") + 1);\r\n                                html = \/<head\/i.test(html)\r\n                                    ? html.replace(\/<head([^>]*)>\/i, `<head$1><base href=\"${base}\">`)\r\n                                    : `<head><base href=\"${base}\"><\/head>` + html;\r\n                                const w = window.open(\"about:blank\");\r\n                                w.document.write(html);\r\n                                w.document.close();\r\n                                DOM.loader.classList.remove(\"active\");\r\n                            })\r\n                            .catch(() => {\r\n                                DOM.loader.classList.remove(\"active\");\r\n                                Toast.show(\"Failed to load game.\");\r\n                            });\r\n                    }, 350);\r\n                },\r\n            };\r\n\r\n            \/* \u2500\u2500 GENRES \u2500\u2500 *\/\r\n            const Genres = {\r\n                init() {\r\n                    const genres = [\"All\", ...new Set(data.flatMap((g) => g.genres))];\r\n                    genres.forEach((g) => {\r\n                        const btn = document.createElement(\"button\");\r\n                        btn.className = \"genre-btn\" + (g === \"All\" ? \" active\" : \"\");\r\n                        btn.textContent = g;\r\n                        btn.onclick = () => {\r\n                            document.querySelectorAll(\".genre-btn\").forEach((b) => b.classList.remove(\"active\"));\r\n                            btn.classList.add(\"active\");\r\n                            STATE.activeGenre = g;\r\n                            Filters.apply();\r\n                        };\r\n                        DOM.genreBar.appendChild(btn);\r\n                    });\r\n                },\r\n            };\r\n\r\n            \/* \u2500\u2500 CARD RENDERING \u2500\u2500 *\/\r\n            const UI = {\r\n                render(list) {\r\n                    DOM.container.innerHTML = \"\";\r\n                    if (!list.length) {\r\n                        DOM.container.innerHTML = `<div style=\"grid-column:1\/-1;color:var(--muted);opacity:.6;padding:40px 0;font-size:.9rem;\">No games found.<\/div>`;\r\n                        return;\r\n                    }\r\n                    list.forEach((item, i) => {\r\n                        const isFav = STATE.favorites.some((f) => f.name === item.name);\r\n                        const box = document.createElement(\"div\");\r\n                        box.className = \"box\";\r\n                        box.style.animationDelay = `${Math.min(i * 0.04, 0.5)}s`;\r\n                        box.dataset.image = item.image;\r\n\r\n                        box.innerHTML = `\r\n                        <div class=\"card-top\">\r\n                            <div class=\"card-topbar\">\r\n                                <div class=\"genre-tags\">${item.genres.map((g) => `<span class=\"genre-tag\">${g}<\/span>`).join(\"\")}<\/div>\r\n                                <button class=\"favorite-btn${isFav ? \" active\" : \"\"}\" aria-label=\"Favorite ${item.name}\" title=\"${isFav ? \"Remove from favorites\" : \"Add to favorites\"}\">\u2605<\/button>\r\n                            <\/div>\r\n                            <h3>${item.name}<\/h3>\r\n                            <p>${item.description}<\/p>\r\n                        <\/div>\r\n                        <button class=\"launch-btn\">Launch Game<\/button>\r\n                    `;\r\n\r\n                        box.querySelector(\".favorite-btn\").onclick = (e) => {\r\n                            e.stopPropagation();\r\n                            Favorites.toggle(item);\r\n                        };\r\n                        box.querySelector(\".launch-btn\").onclick = () => Game.open(item.url);\r\n                        DOM.container.appendChild(box);\r\n                    });\r\n                    this.lazyLoad();\r\n                },\r\n\r\n                lazyLoad() {\r\n                    const obs = new IntersectionObserver(\r\n                        (entries, o) => {\r\n                            entries.forEach((entry) => {\r\n                                if (!entry.isIntersecting) return;\r\n                                const box = entry.target;\r\n                                if (box.dataset.image) {\r\n                                    box.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.52),rgba(0,0,0,0.52)),url(${box.dataset.image})`;\r\n                                    box.style.backgroundSize = \"cover\";\r\n                                    box.style.backgroundPosition = \"center\";\r\n                                }\r\n                                o.unobserve(box);\r\n                            });\r\n                        },\r\n                        { rootMargin: \"250px\" }\r\n                    );\r\n                    document.querySelectorAll(\".box[data-image]\").forEach((b) => obs.observe(b));\r\n                },\r\n            };\r\n\r\n            \/* \u2500\u2500 FILTERS \u2500\u2500 *\/\r\n            const Filters = {\r\n                apply() {\r\n                    const q = DOM.search.value.toLowerCase().trim();\r\n                    const filtered = data.filter((item) => {\r\n                        const textMatch =\r\n                            !q ||\r\n                            item.name.toLowerCase().includes(q) ||\r\n                            item.description.toLowerCase().includes(q) ||\r\n                            item.genres.some((g) => g.toLowerCase().includes(q));\r\n                        const genreMatch = STATE.activeGenre === \"All\" || item.genres.includes(STATE.activeGenre);\r\n                        return textMatch && genreMatch;\r\n                    });\r\n                    UI.render(filtered);\r\n                },\r\n            };\r\n\r\n            \/* \u2500\u2500 PANELS \u2500\u2500 *\/\r\n            const Panels = {\r\n                closeAll() {\r\n                    [DOM.cloakPanel, DOM.settingsPanel].forEach((p) => p.classList.remove(\"open\"));\r\n                    [DOM.cloakBtn, DOM.settingsBtn].forEach((b) => b.classList.remove(\"active\"));\r\n                },\r\n                toggle(panel, button) {\r\n                    const wasOpen = panel.classList.contains(\"open\");\r\n                    this.closeAll();\r\n                    if (!wasOpen) {\r\n                        panel.classList.add(\"open\");\r\n                        button.classList.add(\"active\");\r\n                    }\r\n                },\r\n                init() {\r\n                    DOM.cloakBtn.onclick = (e) => {\r\n                        e.stopPropagation();\r\n                        Panels.toggle(DOM.cloakPanel, DOM.cloakBtn);\r\n                    };\r\n                    DOM.settingsBtn.onclick = (e) => {\r\n                        e.stopPropagation();\r\n                        Panels.toggle(DOM.settingsPanel, DOM.settingsBtn);\r\n                    };\r\n                    document.addEventListener(\"click\", (e) => {\r\n                        if (\r\n                            !DOM.cloakPanel.contains(e.target) &&\r\n                            e.target !== DOM.cloakBtn &&\r\n                            !DOM.settingsPanel.contains(e.target) &&\r\n                            e.target !== DOM.settingsBtn\r\n                        ) {\r\n                            Panels.closeAll();\r\n                        }\r\n                    });\r\n                    document.addEventListener(\"keydown\", (e) => {\r\n                        if (e.key === \"Escape\") Panels.closeAll();\r\n                    });\r\n                },\r\n            };\r\n\r\n            \/* \u2500\u2500 CLOAKER \u2500\u2500 *\/\r\n            const Cloaker = {\r\n                originalTitle: document.title,\r\n                originalFavicon: document.querySelector(\"link[rel='icon']\")?.href || \"\",\r\n                cloaked: false,\r\n\r\n                init() {\r\n                    const applyBtn = document.getElementById(\"apply-cloak\");\r\n                    const resetBtn = document.getElementById(\"reset-cloak\");\r\n                    const status = document.getElementById(\"cloak-status\");\r\n                    const titleInput = document.getElementById(\"custom-title\");\r\n                    const iconInput = document.getElementById(\"custom-favicon\");\r\n\r\n                    document.querySelectorAll(\".preset-btn\").forEach((pb) => {\r\n                        pb.onclick = (e) => {\r\n                            e.stopPropagation();\r\n                            document.querySelectorAll(\".preset-btn\").forEach((p) => p.classList.remove(\"selected\"));\r\n                            pb.classList.add(\"selected\");\r\n                            titleInput.value = pb.dataset.title;\r\n                            iconInput.value = pb.dataset.icon;\r\n                        };\r\n                    });\r\n\r\n                    applyBtn.onclick = (e) => {\r\n                        e.stopPropagation();\r\n                        const title = titleInput.value.trim();\r\n                        const favicon = iconInput.value.trim();\r\n                        if (!title && !favicon) return;\r\n                        if (title) document.title = title;\r\n                        if (favicon) this.setFavicon(favicon);\r\n                        this.cloaked = true;\r\n                        DOM.cloakBtn.classList.add(\"active\");\r\n                        DOM.cloakBtn.innerHTML = ICON_EYE_ON;\r\n                        status.classList.add(\"visible\");\r\n                        Panels.closeAll();\r\n                    };\r\n\r\n                    resetBtn.onclick = (e) => {\r\n                        e.stopPropagation();\r\n                        document.title = this.originalTitle;\r\n                        this.setFavicon(\r\n                            this.originalFavicon ||\r\n                                \"https:\/\/github.com\/CorduroyBrick49\/Banana Town\/blob\/main\/AtlasIcon.ico?raw=true\"\r\n                        );\r\n                        this.cloaked = false;\r\n                        DOM.cloakBtn.classList.remove(\"active\");\r\n                        DOM.cloakBtn.innerHTML = ICON_EYE_OFF;\r\n                        status.classList.remove(\"visible\");\r\n                        titleInput.value = \"\";\r\n                        iconInput.value = \"\";\r\n                        document.querySelectorAll(\".preset-btn\").forEach((p) => p.classList.remove(\"selected\"));\r\n                    };\r\n                },\r\n\r\n                setFavicon(url) {\r\n                    document\r\n                        .querySelectorAll(\"link[rel='icon'], link[rel='shortcut icon']\")\r\n                        .forEach((el) => el.remove());\r\n                    const link = Object.assign(document.createElement(\"link\"), {\r\n                        rel: \"icon\",\r\n                        type: \"image\/x-icon\",\r\n                        href: url,\r\n                    });\r\n                    document.head.appendChild(link);\r\n                },\r\n            };\r\n\r\n            \/* \u2500\u2500 BOOT \u2500\u2500 *\/\r\n            function init() {\r\n                Theme.init();\r\n                Theme.apply(Theme.getPreferred());\r\n                Genres.init();\r\n                Favorites.render();\r\n                UI.render(data);\r\n                DOM.search.addEventListener(\"input\", Filters.apply.bind(Filters));\r\n                Panels.init();\r\n                Cloaker.init();\r\n            }\r\n\r\n            init(
